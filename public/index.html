<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JotPsych Bear</title>
  <meta name="description" content="Describe a JotPsych feature and our bear explains it in a short video.">
  <meta name="theme-color" content="#1E125E">
  <link rel="icon" href="/mascot.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --midnight: #1C1E85;
      --deep: #1E125E;
      --warm: #FFF2F5;
      --sunset: #FD96C9;
      --afterglow: #813FE8;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; }
    body {
      min-height: 100dvh;
      background: var(--warm);
      color: var(--deep);
      font-family: "Nunito", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 1040px;
      margin: 0 auto;
      padding: 32px 16px 48px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 380px);
      gap: 40px;
      align-items: start;
    }
    .intro { grid-column: 1; grid-row: 1; }
    .examples { grid-column: 1; grid-row: 2; }
    .stage { grid-column: 2; grid-row: 1 / span 2; }
    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; gap: 24px; padding-top: 20px; }
      .intro, .examples, .stage { grid-column: 1; grid-row: auto; }
      .stage { justify-self: center; width: min(100%, 380px); }
    }

    h1 { font-size: clamp(28px, 4vw, 40px); line-height: 1.1; margin: 0 0 10px; font-weight: 900; color: var(--midnight); }
    .lede { margin: 0 0 24px; font-size: 17px; line-height: 1.5; color: var(--deep); opacity: .8; }

    label { display: block; font-weight: 800; margin-bottom: 8px; font-size: 15px; }
    textarea {
      width: 100%;
      min-height: 140px;
      resize: vertical;
      padding: 14px 16px;
      border: 2px solid color-mix(in srgb, var(--midnight) 25%, transparent);
      border-radius: 16px;
      background: #fff;
      color: var(--deep);
      font: inherit;
      font-size: 17px;
      line-height: 1.45;
    }
    textarea:focus { outline: none; border-color: var(--afterglow); box-shadow: 0 0 0 4px color-mix(in srgb, var(--afterglow) 20%, transparent); }

    .row { display: flex; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
    button.go {
      appearance: none; border: 0; cursor: pointer;
      background: var(--midnight); color: var(--warm);
      font: inherit; font-weight: 900; font-size: 18px;
      padding: 14px 40px; border-radius: 999px;
      box-shadow: 0 6px 0 var(--deep);
      transition: transform .08s, box-shadow .08s, background .2s;
    }
    button.go:hover { background: var(--afterglow); }
    button.go:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--deep); }
    button.go:disabled { opacity: .55; cursor: progress; transform: none; box-shadow: 0 6px 0 var(--deep); background: var(--midnight); }
    .count { font-size: 13px; opacity: .6; margin-left: auto; }

    .examples { margin-top: 0; }
    .examples p { margin: 0 0 8px; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; opacity: .6; }
    .chip {
      display: block; width: 100%; text-align: left; cursor: pointer;
      margin-bottom: 8px; padding: 10px 14px;
      background: color-mix(in srgb, var(--sunset) 22%, #fff);
      border: 1px solid color-mix(in srgb, var(--sunset) 60%, transparent);
      border-radius: 12px; color: var(--deep); font: inherit; font-size: 14px; line-height: 1.4;
    }
    .chip:hover { background: color-mix(in srgb, var(--sunset) 38%, #fff); }

    .status { margin-top: 20px; min-height: 24px; font-weight: 700; font-size: 15px; }
    .status.error { color: #B3124F; }
    .steps { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; font-size: 14px; }
    .steps li { display: flex; align-items: center; gap: 8px; opacity: .45; }
    .steps li::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--midnight); flex: none; }
    .steps li.active { opacity: 1; }
    .steps li.active::before { background: var(--sunset); border-color: var(--sunset); animation: pulse 1s ease-in-out infinite; }
    .steps li.done { opacity: .9; }
    .steps li.done::before { background: var(--midnight); }
    @keyframes pulse { 50% { transform: scale(1.35); } }
    .script { margin-top: 16px; padding: 14px 16px; background: #fff; border-radius: 14px; border-left: 4px solid var(--afterglow); font-size: 15px; line-height: 1.5; }
    .script:empty { display: none; }
    .script::before { content: "What the bear will say"; display: block; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--afterglow); margin-bottom: 4px; }

    /* The branded frame around the vertical video. */
    .stage { position: sticky; top: 20px; }
    .frame {
      padding: 10px;
      border-radius: 28px;
      background: linear-gradient(160deg, var(--afterglow), var(--deep) 55%, var(--midnight));
      box-shadow: 0 18px 40px -16px color-mix(in srgb, var(--deep) 60%, transparent);
    }
    .screen {
      position: relative;
      aspect-ratio: 9 / 16;
      border-radius: 20px;
      overflow: hidden;
      background: var(--deep) url("/mascot.png") center / cover no-repeat;
    }
    .screen video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: transparent; }
    .screen video:not([src]) { visibility: hidden; }
    .placeholder {
      position: absolute; inset: auto 0 0 0; padding: 18px;
      background: linear-gradient(transparent, color-mix(in srgb, var(--deep) 85%, transparent));
      color: var(--warm); text-align: center; font-weight: 800; font-size: 15px;
    }
    .screen.has-video .placeholder { display: none; }
    .screen.busy::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(110deg, transparent 30%, rgba(255,242,245,.25) 50%, transparent 70%);
      background-size: 250% 100%; animation: shimmer 1.8s linear infinite; pointer-events: none;
    }
    @keyframes shimmer { from { background-position: 150% 0; } to { background-position: -100% 0; } }

    /* Subtitles: drawn from the WebVTT track, in JotPsych colors. */
    .captions {
      position: absolute; left: 8%; right: 8%; bottom: 11%;
      text-align: center; pointer-events: none;
    }
    .captions span {
      display: inline; padding: 4px 10px; line-height: 1.6;
      background: var(--midnight); color: var(--warm);
      font-weight: 900; font-size: clamp(16px, 5.2cqw, 22px);
      border-radius: 10px; -webkit-box-decoration-break: clone; box-decoration-break: clone;
    }
    .captions b { color: var(--sunset); font-weight: 900; }
    .screen { container-type: inline-size; }
    .caption-note { text-align: center; font-size: 12px; opacity: .55; margin-top: 10px; }
  </style>
</head>
<body>
  <main>
    <section class="intro">
      <h1>Meet the JotPsych bear</h1>
      <p class="lede">Describe a JotPsych feature, press Go, and our bear will explain it in a short video.</p>

      <form id="form">
        <label for="feature">Describe a JotPsych feature</label>
        <textarea id="feature" maxlength="600" required placeholder="e.g. JotPsych listens to the visit and writes the clinical note, so the clinician does not type during the session."></textarea>
        <div class="row">
          <button class="go" id="go" type="submit">Go</button>
          <span class="count" id="count">0 / 600</span>
        </div>
      </form>

      <div class="status" id="status" role="status" aria-live="polite"></div>
      <ol class="steps" id="steps" hidden>
        <li data-step="script">Writing the script</li>
        <li data-step="voice">Recording the bear's voice</li>
        <li data-step="video">Animating the bear</li>
      </ol>
      <div class="script" id="script"></div>


    </section>

    <section class="stage" aria-label="Video">
      <div class="frame">
        <div class="screen" id="screen">
          <video id="video" playsinline controls preload="auto"></video>
          <div class="captions" id="captions" aria-hidden="true"></div>
          <div class="placeholder" id="placeholder">Your video plays here</div>
        </div>
      </div>
      <p class="caption-note">Vertical · about 20 seconds · with subtitles</p>
    </section>

    <section class="examples" aria-label="Examples">
      <p>Try an example</p>
      <button class="chip" type="button">JotPsych listens to the visit and writes the clinical note, so the clinician does not type during the session.</button>
      <button class="chip" type="button">JotPsych checks each claim against the payer's rules (the payer is the insurance company that pays the claim) before it is submitted, so fewer claims are denied.</button>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const form = $("form"), input = $("feature"), go = $("go"), statusEl = $("status");
    const stepsEl = $("steps"), scriptEl = $("script"), video = $("video"), screen = $("screen"), captionsEl = $("captions");
    const POLL_MS = 3000, VOICE_TIMEOUT_MS = 90_000, VIDEO_TIMEOUT_MS = 6 * 60_000;
    let runId = 0;

    input.addEventListener("input", () => { $("count").textContent = `${input.value.length} / 600`; });
    document.querySelectorAll(".chip").forEach((chip) => chip.addEventListener("click", () => {
      input.value = chip.textContent.trim();
      input.dispatchEvent(new Event("input"));
      input.focus();
    }));

    form.addEventListener("submit", (e) => { e.preventDefault(); run(); });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); run(); }
    });

    async function run() {
      const feature = input.value.trim();
      if (!feature) { setStatus("Describe a JotPsych feature first.", true); input.focus(); return; }
      const id = ++runId;
      const alive = () => id === runId;

      go.disabled = true;
      resetVideo();
      scriptEl.textContent = "";
      screen.classList.add("busy");
      stepsEl.hidden = false;
      setStatus("Making a brand-new video. This takes about a minute.");
      if (matchMedia("(max-width: 820px)").matches) screen.scrollIntoView({ behavior: "smooth", block: "center" });

      try {
        setStep("script");
        let { script } = await api("/api/script", { feature });
        if (!alive()) return;
        scriptEl.textContent = script;

        setStep("voice");
        setStatus("Recording the bear's voice…");
        let voice = await recordVoice(script, alive);
        if (voice.tooLong) {
          // Over the 20-second cap: ask for a shorter script once, then record again.
          setStep("script");
          ({ script } = await api("/api/script", { feature, shorter: true }));
          if (!alive()) return;
          scriptEl.textContent = script;
          setStep("voice");
          voice = await recordVoice(script, alive);
        }
        if (!alive()) return;

        setStep("video");
        setStatus("Animating the bear. Almost there…");
        const job = await api("/api/animate", { audioUrl: voice.audioUrl });
        const done = await poll("video", job.id, VIDEO_TIMEOUT_MS, alive);
        if (!alive()) return;

        setStep("done");
        showVideo(done.videoUrl, voice.words);
        setStatus("Here's your video. Press Go again for a new one.");
      } catch (err) {
        if (!alive()) return;
        console.error(err);
        setStatus(err.message || "Something went wrong. Please press Go to try again.", true);
        stepsEl.querySelectorAll("li.active").forEach((li) => li.classList.remove("active"));
      } finally {
        if (alive()) { go.disabled = false; screen.classList.remove("busy"); }
      }
    }

    async function recordVoice(script, alive) {
      const job = await api("/api/voice", { script });
      return poll("voice", job.id, VOICE_TIMEOUT_MS, alive);
    }

    async function poll(stage, id, timeoutMs, alive) {
      const started = Date.now();
      let misses = 0;
      while (alive()) {
        await sleep(POLL_MS);
        if (Date.now() - started > timeoutMs) throw new Error("This is taking longer than usual. Please press Go to try again.");
        try {
          const res = await api(`/api/status?stage=${stage}&id=${encodeURIComponent(id)}`);
          misses = 0;
          if (res.done) return res;
        } catch (err) {
          // An error from the server is final; a network blip gets a few more tries.
          if (err.status || ++misses >= 4) throw err;
        }
      }
      return {};
    }

    async function api(url, body) {
      let res;
      try {
        res = await fetch(url, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : {});
      } catch {
        throw new Error("We couldn't reach the server. Check your connection and press Go again.");
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const err = new Error(data.error || "Something went wrong. Please press Go to try again.");
        err.status = res.status;
        throw err;
      }
      return data;
    }

    function setStep(name) {
      const order = ["script", "voice", "video"];
      const at = name === "done" ? order.length : order.indexOf(name);
      stepsEl.querySelectorAll("li").forEach((li, i) => {
        li.classList.toggle("done", i < at);
        li.classList.toggle("active", i === at);
      });
    }

    function setStatus(text, isError = false) {
      statusEl.textContent = text;
      $("placeholder").textContent = text;
      statusEl.classList.toggle("error", isError);
    }

    // ---- Video + subtitles ----

    function resetVideo() {
      video.pause();
      video.removeAttribute("src");
      video.querySelectorAll("track").forEach((t) => t.remove());
      video.load();
      captionsEl.innerHTML = "";
      screen.classList.remove("has-video");
    }

    function showVideo(url, words) {
      resetVideo();
      const track = document.createElement("track");
      track.kind = "subtitles";
      track.label = "English";
      track.srclang = "en";
      track.src = URL.createObjectURL(new Blob([buildVtt(words)], { type: "text/vtt" }));
      track.default = true;
      video.appendChild(track);
      video.src = url;
      screen.classList.add("has-video");

      // We draw the cues ourselves (in brand colors), so hide the browser's default rendering.
      const textTrack = video.textTracks[0];
      textTrack.mode = "hidden";
      const render = () => {
        const cue = textTrack.activeCues && textTrack.activeCues[0];
        captionsEl.innerHTML = cue ? `<span>${highlight(cue, video.currentTime)}</span>` : "";
      };
      textTrack.addEventListener("cuechange", render);
      video.addEventListener("timeupdate", render);
      video.addEventListener("ended", () => { captionsEl.innerHTML = ""; });

      video.play().catch(() => { /* Autoplay with sound blocked: the play control is right there. */ });
    }

    // Group words into short cues (max 5 words, break after punctuation).
    function buildVtt(words) {
      const cues = [];
      let cur = [];
      words.forEach((w, i) => {
        cur.push(w);
        const endsSentence = /[.!?,;:—]$/.test(w.text);
        if (cur.length >= 5 || endsSentence || i === words.length - 1) { cues.push(cur); cur = []; }
      });
      let out = "WEBVTT\n\n";
      cues.forEach((cue, i) => {
        const start = cue[0].start;
        const next = cues[i + 1];
        const end = next ? Math.max(cue[cue.length - 1].end, Math.min(next[0].start, cue[cue.length - 1].end + 0.6)) : cue[cue.length - 1].end + 0.6;
        const body = cue.map((w) => `<${ts(w.start)}>${escapeHtml(w.text)}`).join(" ");
        out += `${i + 1}\n${ts(start)} --> ${ts(end)}\n${body}\n\n`;
      });
      return out;
    }

    // Highlight the word being spoken, using the karaoke timestamps inside the cue.
    function highlight(cue, now) {
      const parts = cue.text.split(/<(\d{2}:\d{2}:\d{2}\.\d{3})>/).slice(1);
      const words = [];
      for (let i = 0; i < parts.length; i += 2) words.push({ t: parseTs(parts[i]), text: parts[i + 1].trim() });
      let current = -1;
      words.forEach((w, i) => { if (now >= w.t) current = i; });
      return words.map((w, i) => (i === current ? `<b>${w.text}</b>` : w.text)).join(" ");
    }

    function ts(sec) {
      const ms = Math.max(0, Math.round(sec * 1000));
      const h = Math.floor(ms / 3600000), m = Math.floor(ms / 60000) % 60, s = Math.floor(ms / 1000) % 60;
      return `${pad(h)}:${pad(m)}:${pad(s)}.${String(ms % 1000).padStart(3, "0")}`;
    }
    const parseTs = (t) => { const [h, m, s] = t.split(":"); return +h * 3600 + +m * 60 + parseFloat(s); };
    const pad = (n) => String(n).padStart(2, "0");
    const escapeHtml = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  </script>
</body>
</html>
